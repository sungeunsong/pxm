events {}

http {
  server_tokens off;
  client_max_body_size 10m;
  limit_req_zone $binary_remote_addr zone=pxm_login:10m rate=10r/m;

  upstream pxm_api {
    server api:3000;
    keepalive 32;
  }

  server {
    listen 8080;
    return 308 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PXM_TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /proxy-health {
      access_log off;
      default_type application/json;
      return 200 '{"ok":true}';
    }

    location = /api/auth/login {
      limit_req zone=pxm_login burst=5 nodelay;
      proxy_pass http://pxm_api;
      include /etc/nginx/pxm-proxy-headers.conf;
    }

    location /api/instances/ {
      proxy_pass http://pxm_api;
      proxy_buffering off;
      proxy_read_timeout 1h;
      include /etc/nginx/pxm-proxy-headers.conf;
    }

    location / {
      proxy_pass http://pxm_api;
      include /etc/nginx/pxm-proxy-headers.conf;
    }
  }
}
