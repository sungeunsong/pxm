<circle cx="890" cy="562" r="6" fill="#2563eb"/>
<text x="914" y="572" font-size="29" font-weight="600" fill="#334155">runtime과 업무 연동 책임 분리</text>
  
  <text x="1460" y="820" font-size="22" font-weight="800" fill="#94a3b8">06 / 10</text>
