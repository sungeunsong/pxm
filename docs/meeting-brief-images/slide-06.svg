  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="42" y="38" width="1516" height="824" rx="30" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="96" y="112" font-size="24" font-weight="800" fill="#2563eb">PXM BPM PLATFORM</text>
  <text x="96" y="184" font-size="54" font-weight="900" fill="#0f172a">플러그인 방식으로 바꾼 이유</text>
  <text x="98" y="229" font-size="28" font-weight="600" fill="#64748b">Engine 수정 없이 업무 connector를 확장하기 위해</text>
  
  <rect x="120" y="240" width="690" height="460" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="154" y="298" font-size="34" font-weight="800" fill="#1d4ed8">기존 하드코딩 방식의 문제</text>
  <circle cx="160" cy="346" r="6" fill="#2563eb"/>
<text x="184" y="356" font-size="29" font-weight="600" fill="#334155">Slack/Jira/ACRA/NIT 연동이 Engine 코드에 섞임</text>
<circle cx="160" cy="405" r="6" fill="#2563eb"/>
<text x="184" y="415" font-size="29" font-weight="600" fill="#334155">새 연동 추가 시 Engine 수정 필요</text>
<circle cx="160" cy="464" r="6" fill="#2563eb"/>
<text x="184" y="474" font-size="29" font-weight="600" fill="#334155">Engine 배포가 잦아짐</text>
<circle cx="160" cy="523" r="6" fill="#2563eb"/>
<text x="184" y="533" font-size="29" font-weight="600" fill="#334155">고객사별 connector 차이를 흡수하기 어려움</text>
  

  <rect x="850" y="240" width="690" height="460" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="884" y="298" font-size="34" font-weight="800" fill="#1d4ed8">Plugin 구조의 장점</text>
  <circle cx="890" cy="346" r="6" fill="#2563eb"/>
<text x="914" y="356" font-size="29" font-weight="600" fill="#334155">Engine은 plugin_id만 알고 실행</text>
<circle cx="890" cy="405" r="6" fill="#2563eb"/>
<text x="914" y="415" font-size="29" font-weight="600" fill="#334155">업무 의미는 plugin-host 또는 external</text>
<text x="914" y="454" font-size="29" font-weight="600" fill="#334155">service가 담당</text>
<circle cx="890" cy="503" r="6" fill="#2563eb"/>
