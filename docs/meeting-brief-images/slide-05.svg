<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="42" y="38" width="1516" height="824" rx="30" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="96" y="112" font-size="24" font-weight="800" fill="#2563eb">PXM BPM PLATFORM</text>
  <text x="96" y="184" font-size="54" font-weight="900" fill="#0f172a">DB Adapter와 Mongo 우선 전략</text>
  <text x="98" y="229" font-size="28" font-weight="600" fill="#64748b">Runtime data를 특정 DB 구현에 고정하지 않는 구조</text>
  <circle cx="130" cy="240" r="6" fill="#2563eb"/>
<text x="154" y="250" font-size="29" font-weight="600" fill="#1e293b">workflow instance, context, form data, execution log는 JSON 성격이</text>
<text x="154" y="289" font-size="29" font-weight="600" fill="#1e293b">강하다.</text>
<circle cx="130" cy="338" r="6" fill="#2563eb"/>
<text x="154" y="348" font-size="29" font-weight="600" fill="#1e293b">MongoDB는 초기 runtime 검증과 유연한 context 저장에 적합하다.</text>
<circle cx="130" cy="397" r="6" fill="#2563eb"/>
<text x="154" y="407" font-size="29" font-weight="600" fill="#1e293b">API와 Engine은 DB adapter/port를 통해 runtime data를 다룬다.</text>
<circle cx="130" cy="456" r="6" fill="#2563eb"/>
<text x="154" y="466" font-size="29" font-weight="600" fill="#1e293b">PostgreSQL adapter도 확장 가능한 구조로 유지한다.</text>
<rect x="130" y="610" width="416" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="150" y="638" font-size="22" font-weight="700" fill="#1e40af">v2_process_definitions</text>
<rect x="562" y="610" width="382" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="582" y="638" font-size="22" font-weight="700" fill="#1e40af">v2_process_instances</text>
<rect x="960" y="610" width="195" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="980" y="638" font-size="22" font-weight="700" fill="#1e40af">v2_tokens</text>
<rect x="1171" y="610" width="180" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="1191" y="638" font-size="22" font-weight="700" fill="#1e40af">v2_tasks</text>
<rect x="130" y="672" width="280" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="150" y="700" font-size="22" font-weight="700" fill="#1e40af">v2_engine_jobs</text>
