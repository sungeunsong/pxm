<text x="759" y="700" font-size="22" font-weight="700" fill="#1e40af">v2_execution_logs</text>
<rect x="1086" y="672" width="331" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="1106" y="700" font-size="22" font-weight="700" fill="#1e40af">v2_advisory_locks</text>
  <text x="1460" y="820" font-size="22" font-weight="800" fill="#94a3b8">05 / 10</text>
