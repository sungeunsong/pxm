<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="42" y="38" width="1516" height="824" rx="30" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="96" y="112" font-size="24" font-weight="800" fill="#2563eb">PXM BPM PLATFORM</text>
  <text x="96" y="184" font-size="54" font-weight="900" fill="#0f172a">Plugin Registry와 Web Palette</text>
  <text x="98" y="229" font-size="28" font-weight="600" fill="#64748b">Manifest 기반으로 Web node와 실행 계약을 제공</text>
  <circle cx="130" cy="240" r="6" fill="#2563eb"/>
<text x="154" y="250" font-size="29" font-weight="600" fill="#1e293b">Plugin Registry는 plugin_id, version, category, schema, executor</text>
<text x="154" y="289" font-size="29" font-weight="600" fill="#1e293b">정보를 가진다.</text>
<circle cx="130" cy="338" r="6" fill="#2563eb"/>
<text x="154" y="348" font-size="29" font-weight="600" fill="#1e293b">Web은 manifest를 보고 plugin palette와 node 설정 form을 렌더링한다.</text>
<circle cx="130" cy="397" r="6" fill="#2563eb"/>
<text x="154" y="407" font-size="29" font-weight="600" fill="#1e293b">Slack, NIT, ACRA, Jira, HR, AD 같은 연동이 1급 노드처럼 보인다.</text>
<circle cx="130" cy="456" r="6" fill="#2563eb"/>
<text x="154" y="466" font-size="29" font-weight="600" fill="#1e293b">저장되는 runtime shape은 node_type = service, plugin_id = connector.*</text>
<text x="154" y="505" font-size="29" font-weight="600" fill="#1e293b">이다.</text>
<rect x="130" y="610" width="518" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="150" y="638" font-size="22" font-weight="700" fill="#1e40af">connector.slack.send_message</text>
<rect x="664" y="610" width="484" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="684" y="638" font-size="22" font-weight="700" fill="#1e40af">connector.nit.create_issue</text>
<rect x="130" y="672" width="569" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="150" y="700" font-size="22" font-weight="700" fill="#1e40af">connector.acra.grant_permission</text>
<rect x="715" y="672" width="501" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="735" y="700" font-size="22" font-weight="700" fill="#1e40af">connector.jira.create_issue</text>
<rect x="130" y="734" width="450" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="150" y="762" font-size="22" font-weight="700" fill="#1e40af">connector.hr.lookup_user</text>
<rect x="596" y="734" width="450" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="616" y="762" font-size="22" font-weight="700" fill="#1e40af">connector.ad.grant_group</text>
<rect x="1062" y="734" width="382" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="1082" y="762" font-size="22" font-weight="700" fill="#1e40af">builtin.http_request</text>
  <text x="1460" y="820" font-size="22" font-weight="800" fill="#94a3b8">07 / 10</text>
</svg>