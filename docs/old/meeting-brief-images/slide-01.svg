<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="42" y="38" width="1516" height="824" rx="30" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="96" y="112" font-size="24" font-weight="800" fill="#2563eb">PXM BPM PLATFORM</text>
  <text x="96" y="184" font-size="54" font-weight="900" fill="#0f172a">PXM/BPM 플랫폼 구조</text>
  <text x="98" y="229" font-size="28" font-weight="600" fill="#64748b">Workflow runtime과 외부 시스템 연동을 분리한 BPM Core</text>
  <circle cx="130" cy="240" r="6" fill="#2563eb"/>
<text x="154" y="250" font-size="29" font-weight="600" fill="#1e293b">BPM Web에서 프로세스를 설계하고 실행한다.</text>
<circle cx="130" cy="299" r="6" fill="#2563eb"/>
<text x="154" y="309" font-size="29" font-weight="600" fill="#1e293b">API/BFF가 템플릿, 인스턴스, Task, Plugin Registry를 관리한다.</text>
<circle cx="130" cy="358" r="6" fill="#2563eb"/>
<text x="154" y="368" font-size="29" font-weight="600" fill="#1e293b">Engine은 workflow runtime 실행에 집중한다.</text>
<circle cx="130" cy="417" r="6" fill="#2563eb"/>
<text x="154" y="427" font-size="29" font-weight="600" fill="#1e293b">외부 시스템 연동은 Engine에 하드코딩하지 않고 plugin으로 확장한다.</text>
<circle cx="130" cy="476" r="6" fill="#2563eb"/>
<text x="154" y="486" font-size="29" font-weight="600" fill="#1e293b">DB는 adapter 구조로 MongoDB 우선, PostgreSQL 확장 가능하게 설계했다.</text>

        <rect x="140" y="690" width="190" height="90" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="235" y="745" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">BPM Web</text>
        <path d="M 338 735 L 356 735" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
      

        <rect x="368" y="690" width="190" height="90" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="463" y="745" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">API / BFF</text>
        <path d="M 566 735 L 584 735" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
      

        <rect x="596" y="690" width="190" height="90" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="691" y="745" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">DB Adapter</text>
        <path d="M 794 735 L 812 735" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
      

        <rect x="824" y="690" width="190" height="90" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="919" y="745" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">MongoDB 우선</text>
        <path d="M 1022 735 L 1040 735" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
      

        <rect x="1052" y="690" width="190" height="90" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="1147" y="745" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">Engine</text>
        <path d="M 1250 735 L 1268 735" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
      

        <rect x="1280" y="690" width="190" height="90" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="1375" y="745" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">Plugin Host</text>
        
      
  <text x="1460" y="820" font-size="22" font-weight="800" fill="#94a3b8">01 / 10</text>
</svg>