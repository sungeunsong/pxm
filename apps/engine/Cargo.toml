[package]
name = "pxm-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = "1"
dotenvy = "0.15"
anyhow = "1"
